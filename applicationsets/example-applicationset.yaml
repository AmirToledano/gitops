apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: example-applicationset
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            team: team-a
          - env: qa
            team: team-a
          - env: prd
            team: team-a
          - env: stage
            team: team-a
  template:
    metadata:
      name: '{{team}}-{{env}}'
    spec:
      project: my-project
      source:
        repoURL: https://github.com/AmirToledano/gitops.git
        targetRevision: example-1-appset
        path: '{{team}}/k8s-{{env}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{team}}-{{env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
