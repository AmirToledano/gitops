apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: docker-pj
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/AmirToledano/gitops.git
        revision: main
        directories:
          - path: docker-pj/helmchart/env/*
  template:
    metadata:
      name: 'docker-pj-{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/AmirToledano/gitops.git
        targetRevision: main
        path: docker-pj/helmchart
        helm:
          releaseName: docker-pj
          valueFiles:
            - 'env/{{path.basename}}/values.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'docker-pj-{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
