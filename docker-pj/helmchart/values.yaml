replicaCount: 1

image:
  repository: amirtoledano/docker-pj
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: docker-pj.local

config:
  appMessage: "Hello from my DevOps learning project (via Helm)!"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
